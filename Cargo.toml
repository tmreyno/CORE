[workspace]
resolver = "2"
members = [
    "src-tauri",
    "libewf-ffi",
    "sevenzip-ffi",
    "crates/ffx-formats",
    "crates/ffx-l01-writer",
    "crates/ffx-errors",
    "crates/ffx-aff4",
    "crates/ffx-common",
    "crates/ffx-raw",
    "crates/ffx-ewf",
    "crates/ffx-ad1",
    "crates/ffx-ufed",
    "crates/ffx-archive",
    "crates/ffx-containers",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["CORE-FFX Project Contributors"]
repository = "https://github.com/tmreyno/CORE"

[workspace.dependencies]
# Shared dependencies used by multiple crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
strum = { version = "0.26", features = ["derive"] }
flate2 = { version = "1", features = ["zlib-rs"] }
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = true }
hex = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }

# Internal crates
ffx-formats = { path = "crates/ffx-formats" }
ffx-l01-writer = { path = "crates/ffx-l01-writer" }
ffx-errors = { path = "crates/ffx-errors" }
ffx-aff4 = { path = "crates/ffx-aff4" }
ffx-common = { path = "crates/ffx-common" }
ffx-raw = { path = "crates/ffx-raw" }
ffx-ewf = { path = "crates/ffx-ewf" }
ffx-ad1 = { path = "crates/ffx-ad1" }
ffx-ufed = { path = "crates/ffx-ufed" }
ffx-archive = { path = "crates/ffx-archive" }
ffx-containers = { path = "crates/ffx-containers" }

[patch.crates-io]
libarchive2 = { path = "patches/libarchive2" }
libarchive2-sys = { path = "patches/libarchive2-sys" }
