[package]
name = "ffx-archive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Archive container parser (ZIP, 7z, RAR, TAR, ISO, etc.) for forensic workflows"

[features]
default = []
unrar = ["dep:unrar"]

[dependencies]
ffx-errors = { workspace = true }
ffx-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
dashmap = "6"
memmap2 = "0.9"
xxhash-rust = { workspace = true }
blake3 = "1"
crc32fast = "1.4"
rayon = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { workspace = true }
bzip2 = { version = "0.4", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", features = ["zstdmt"] }
chrono = { workspace = true }
dirs = "5"
hex = { workspace = true }
bincode = "1.3"
libarchive2 = "0.2"
sevenz-rust = "0.6"
seven-zip = { path = "../../sevenzip-ffi" }
unrar = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
