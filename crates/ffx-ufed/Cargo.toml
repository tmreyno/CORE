[package]
name = "ffx-ufed"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "UFED forensic container parser (UFD, UFDR, UFDX, UFED ZIP)"

[dependencies]
ffx-errors = { workspace = true }
ffx-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
dashmap = "6"
chrono = { workspace = true }
memmap2 = "0.9"
xxhash-rust = { workspace = true }
blake3 = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
