    <text x="36" y="92" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Collected item tracking with photo references</text>
    <text x="36" y="114" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Examiner profile auto-fill</text>
    <text x="36" y="136" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">GPS location tagging</text>

