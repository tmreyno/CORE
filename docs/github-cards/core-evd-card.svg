  <text x="230" y="152" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="2">CORE-EVD</text>
  <text x="230" y="190" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.6">CASE ORGANIZATION &amp; REPORTING ECOSYSTEM</text>
  <text x="230" y="222" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">Evidence Documentation</text>

