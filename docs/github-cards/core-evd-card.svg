    <text x="36" y="182" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHAIN OF CUSTODY</text>
    <text x="36" y="210" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Immutable audit trail (draft → locked → voided)</text>
    <text x="36" y="232" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Transfer records with initials</text>
    <text x="36" y="254" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Amendment tracking with reason</text>
    <text x="36" y="276" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Complete COC lifecycle management</text>

    <line x1="36" y1="296" x2="464" y2="296" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="322" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DATA MANAGEMENT</text>
    <text x="36" y="350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">SQLite with WAL mode (fast writes)</text>
    <text x="36" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Project-based evidence organization</text>
    <text x="36" y="394" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Field notes with priority &amp; tagging</text>

    <line x1="36" y1="414" x2="464" y2="414" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="440" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PLATFORMS</text>
    <text x="36" y="464" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">iOS · Android · macOS · Windows · Linux</text>

    <g transform="translate(370, 442)">
