<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="core-arc" x1="18" y1="18" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eab308"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.03">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <rect x="0" y="0" width="1280" height="3" fill="url(#core-arc)"/>

  <!-- Icon -->
  <g transform="translate(80, 100) scale(1.2)">
    <circle cx="50" cy="50" r="48" fill="#111827"/>
    <circle cx="50" cy="50" r="46" fill="none" stroke="#334155" stroke-width="1.25"/>
    <path d="M 63 21 A 33 33 0 1 0 63 79" fill="none" stroke="url(#core-arc)" stroke-width="8.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 58 29 A 24 24 0 1 0 58 71" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <rect x="41" y="37" width="55" height="26" rx="8" fill="url(#badge)"/>
    <rect x="41" y="37" width="55" height="12" rx="8" fill="rgba(255,255,255,0.16)"/>
    <text x="68" y="56" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">WEB</text>
  </g>

  <text x="230" y="152" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="2">CORE-WEB</text>
  <text x="230" y="190" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.6">CASE ORGANIZATION &amp; REPORTING ECOSYSTEM</text>
  <text x="230" y="222" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">Web Evidence Browser — Client-Side Case Review Portal</text>

  <line x1="80" y1="255" x2="620" y2="255" stroke="#1e293b" stroke-width="1"/>

  <!-- Feature pills -->
  <g transform="translate(80, 275)">
    <rect width="200" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#06b6d4"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Case Package Import</text>
  </g>
  <g transform="translate(295, 275)">
    <rect width="165" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#22c55e"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Client-Side Only</text>
  </g>
  <g transform="translate(475, 275)">
    <rect width="175" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Air-Gapped Ready</text>
  </g>
  <g transform="translate(80, 323)">
    <rect width="175" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#f97316"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Light / Dark Theme</text>
  </g>
  <g transform="translate(270, 323)">
    <rect width="180" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#f43f5e"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">Static Deployment</text>
  </g>
  <g transform="translate(465, 323)">
    <rect width="180" height="38" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#a855f7"/>
    <text x="34" y="24" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">6 Review Views</text>
  </g>

  <!-- Tech stack -->
  <g transform="translate(80, 395)">
    <rect width="85" height="30" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="42" y="20" fill="#3b82f6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">SolidJS</text>
  </g>
  <g transform="translate(177, 395)">
    <rect width="105" height="30" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="52" y="20" fill="#f59e0b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">TypeScript</text>
  </g>
  <g transform="translate(294, 395)">
    <rect width="60" height="30" rx="8" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="30" y="20" fill="#06b6d4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Vite</text>
  </g>
  <g transform="translate(366, 395)">
    <rect width="110" height="30" rx="8" fill="none" stroke="#22c55e" stroke-width="1.2"/>
    <text x="55" y="20" fill="#22c55e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Tailwind CSS</text>
  </g>

  <!-- Special badge -->
  <g transform="translate(80, 450)">
    <rect width="330" height="34" rx="8" fill="#422006" stroke="#eab308" stroke-width="1"/>
    <text x="16" y="22" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">🌐 No Rust · No Tauri · Pure Web App</text>
  </g>
  <text x="430" y="472" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">MIT License</text>

  <!-- RIGHT SIDE -->
  <g transform="translate(700, 80)">
    <rect width="500" height="480" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <text x="36" y="42" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REVIEW VIEWS</text>
    <text x="36" y="66" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Case Metadata · Evidence Listings</text>
    <text x="36" y="86" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">COC Records · Transfer History</text>
    <text x="36" y="106" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Report Viewer · Activity Log</text>

    <line x1="36" y1="126" x2="464" y2="126" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="152" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">TARGET USERS</text>
    <text x="36" y="176" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">• Attorneys — review without forensic tools</text>
    <text x="36" y="198" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">• Managers — monitor case progress</text>
    <text x="36" y="220" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">• External Reviewers — shared link access</text>

    <line x1="36" y1="244" x2="464" y2="244" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="270" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DATA SOURCE</text>
    <text x="36" y="294" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">Exported case packages (.json) from</text>
    <text x="36" y="314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">CORE-FFX and CORE-RPT</text>
    <text x="36" y="338" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" font-style="italic">Read-only — no modifications to source data</text>

    <line x1="36" y1="358" x2="464" y2="358" stroke="#1e293b" stroke-width="1"/>

    <text x="36" y="384" fill="#64748b" font-family="Segoe UI, monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DEPLOYMENT</text>
    <g transform="translate(36, 396)">
      <rect width="110" height="24" rx="6" fill="none" stroke="#22c55e" stroke-width="1"/>
      <text x="55" y="16" fill="#22c55e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Static Site</text>
    </g>
    <g transform="translate(156, 396)">
      <rect width="110" height="24" rx="6" fill="none" stroke="#06b6d4" stroke-width="1"/>
      <text x="55" y="16" fill="#06b6d4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Any Server</text>
    </g>
    <g transform="translate(276, 396)">
      <rect width="110" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-width="1"/>
      <text x="55" y="16" fill="#f59e0b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Air-Gapped</text>
    </g>

    <text x="36" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">No server required — runs entirely in browser</text>

    <g transform="translate(370, 442)">
      <rect width="94" height="30" rx="8" fill="none" stroke="#334155" stroke-width="1.2"/>
      <text x="47" y="20" fill="#94a3b8" text-anchor="middle" font-family="Segoe UI Mono, monospace" font-size="13" font-weight="500">v0.2.1</text>
    </g>
  </g>
</svg>