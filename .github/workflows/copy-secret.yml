name: Copy Secret to Repos
on:
  workflow_dispatch:

jobs:
  copy-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Copy APPLE_API_KEY_CONTENT to satellite repos
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          SECRET_VALUE: ${{ secrets.APPLE_API_KEY_CONTENT }}
          PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for repo in tmreyno/CORE-EVD tmreyno/CORE-LAB tmreyno/CORE-RPT; do
            echo "Setting APPLE_API_KEY_CONTENT on $repo..."
            echo "$SECRET_VALUE" | gh secret set APPLE_API_KEY_CONTENT -R "$repo"
            echo "Setting TAURI_SIGNING_PRIVATE_KEY_PASSWORD on $repo..."
            echo "$PASSWORD_VALUE" | gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD -R "$repo"
          done
          echo "Done!"
