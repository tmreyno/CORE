name: Copy Apple Secrets To Satellites

on:
  workflow_dispatch:

jobs:
  copy-apple-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Apple notarization secrets to CORE-ACQ
        env:
          GH_TOKEN_PRIMARY: ${{ secrets.CORE_SHARED_TOKEN }}
          GH_TOKEN_FALLBACK: ${{ secrets.GH_UPDATE_TOKEN }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT_VALUE: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          select_token() {
            if [ -n "$GH_TOKEN_PRIMARY" ]; then
              printf '%s' "$GH_TOKEN_PRIMARY"
              return 0
            fi
            if [ -n "$GH_TOKEN_FALLBACK" ]; then
              printf '%s' "$GH_TOKEN_FALLBACK"
              return 0
            fi
            return 1
          }

          if [ -z "$APPLE_API_ISSUER_VALUE" ] || [ -z "$APPLE_API_KEY_VALUE" ] || [ -z "$APPLE_API_KEY_CONTENT_VALUE" ]; then
            echo "::error::Source Apple notarization secrets are not fully configured in CORE"
            exit 1
          fi

          GH_TOKEN="$(select_token)"
          export GH_TOKEN

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No GitHub token available for cross-repo secret sync"
            exit 1
          fi

          target_repo="tmreyno/CORE-ACQ"

          printf '%s' "$APPLE_API_ISSUER_VALUE" | gh secret set APPLE_API_ISSUER -R "$target_repo"
          printf '%s' "$APPLE_API_KEY_VALUE" | gh secret set APPLE_API_KEY -R "$target_repo"
          printf '%s' "$APPLE_API_KEY_CONTENT_VALUE" | gh secret set APPLE_API_KEY_CONTENT -R "$target_repo"

          echo "Synced Apple notarization secrets to $target_repo"