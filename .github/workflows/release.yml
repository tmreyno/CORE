name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          # Try to extract section from CHANGELOG.md for this version
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${VERSION}\]?/,/^## \[?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG} of CORE-FFX — Forensic File Explorer"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "CORE-FFX ${{ steps.get_tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── macOS Build (Apple Silicon) ────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout core-shared (local dependency)
        env:
          GH_TOKEN: ${{ secrets.CORE_SHARED_TOKEN }}
        run: gh repo clone tmreyno/core-shared ../core-shared -- --depth 1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache-workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies (libarchive, build tools)
        run: |
          # Check if pre-built libarchive exists
          if [ -f "patches/libarchive2-sys/prebuilt/macos-universal/libarchive.a" ]; then
            echo "✅ Pre-built libarchive.a found — skipping brew install libarchive"
            brew install libb2 pkg-config cmake
          else
            brew install libarchive libb2 pkg-config cmake
            # Make libarchive visible to pkg-config (Homebrew keg-only)
            echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
            # Make sure linker can find libarchive
            echo "LIBRARY_PATH=$(brew --prefix libarchive)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      - name: Set up libewf (macOS — prebuilt or from source)
        run: |
          PREBUILT="libewf-ffi/prebuilt/macos-arm64/libewf.a"
          if [ -f "$PREBUILT" ]; then
            # Use pre-built static library (built by prebuild-native-deps.yml)
            PREBUILT_DIR="$(cd libewf-ffi/prebuilt/macos-arm64 && pwd)"
            echo "LIBEWF_DIR=$PREBUILT_DIR" >> "$GITHUB_ENV"
            echo "✅ Using pre-built libewf.a ($(ls -lh "$PREBUILT" | awk '{print $5}'))"
          else
            echo "ℹ️  No pre-built libewf — building from source..."
            curl -sL "https://github.com/libyal/libewf/releases/download/20240506/libewf-experimental-20240506.tar.gz" | tar xzf -
            cd libewf-20240506

            ./configure \
              --prefix=/tmp/libewf-install \
              --enable-static \
              --disable-shared \
              --disable-nls \
              --with-openssl=no \
              --disable-openssl-evp-cipher \
              --disable-openssl-evp-md

            make -j$(sysctl -n hw.ncpu)
            make install

            echo "LIBEWF_DIR=/tmp/libewf-install/lib" >> "$GITHUB_ENV"
            echo "✅ libewf built from source ($(ls -lh /tmp/libewf-install/lib/libewf.a | awk '{print $5}'))"
          fi

      - name: Verify sevenzip-ffi library
        run: |
          if [ -f sevenzip-ffi/prebuilt/macos-arm64/lib7z_ffi.a ]; then
            echo "✅ Pre-built lib7z_ffi.a found ($(ls -lh sevenzip-ffi/prebuilt/macos-arm64/lib7z_ffi.a | awk '{print $5}'))"
          elif [ -f sevenzip-ffi/build/lib7z_ffi.a ]; then
            echo "✅ Pre-built lib7z_ffi.a found in build/ ($(ls -lh sevenzip-ffi/build/lib7z_ffi.a | awk '{print $5}'))"
          else
            echo "::error::lib7z_ffi.a not found"
            echo "Run the 'Pre-build Native Dependencies' workflow (platform: macos) to build it"
            exit 1
          fi

      - name: Install core-shared dependencies
        run: cd ../core-shared && npm install

      - name: Install npm dependencies
        run: npm ci

      - name: Validate and export macOS release secrets
        shell: bash
        env:
          GH_UPDATE_TOKEN_RAW: ${{ secrets.GH_UPDATE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE_RAW: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_RAW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_RAW: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER_RAW: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_RAW: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT_RAW: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          normalize_secret() {
            local name="$1"
            local value="${!name-}"
            if printf '%s' "$value" | grep -q '[^[:space:]]'; then
              printf -v "$name" '%s' "$value"
            else
              printf -v "$name" ''
            fi
          }
          append_env_var() {
            local key="$1"
            local value="$2"
            echo "${key}<<__ENV_EOF__"
            printf '%s\n' "$value"
            echo "__ENV_EOF__"
          }
          append_env_var_if_present() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              append_env_var "$key" "$value"
            fi
          }
          mask_secret_if_present() {
            local value="$1"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          }
          for name in \
            GH_UPDATE_TOKEN_RAW \
            TAURI_SIGNING_PRIVATE_KEY_RAW \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW \
            APPLE_CERTIFICATE_RAW \
            APPLE_CERTIFICATE_PASSWORD_RAW \
            APPLE_SIGNING_IDENTITY_RAW \
            APPLE_API_ISSUER_RAW \
            APPLE_API_KEY_RAW \
            APPLE_API_KEY_CONTENT_RAW; do
            normalize_secret "$name"
          done
          required=(
            TAURI_SIGNING_PRIVATE_KEY_RAW
            APPLE_CERTIFICATE_RAW
            APPLE_CERTIFICATE_PASSWORD_RAW
            APPLE_SIGNING_IDENTITY_RAW
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("${name%_RAW}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing required secrets: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          if [ -z "$GH_UPDATE_TOKEN_RAW" ]; then
            echo "::warning::GH_UPDATE_TOKEN is blank or not set; continuing without authenticated updater asset access"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is blank or not set (optional)"
          fi
          has_notary_issuer=false
          has_notary_key=false
          has_notary_content=false
          [ -n "$APPLE_API_ISSUER_RAW" ] && has_notary_issuer=true
          [ -n "$APPLE_API_KEY_RAW" ] && has_notary_key=true
          [ -n "$APPLE_API_KEY_CONTENT_RAW" ] && has_notary_content=true
          if $has_notary_issuer && $has_notary_key && $has_notary_content; then
            apple_notarization_enabled=true
          else
            apple_notarization_enabled=false
            if $has_notary_issuer || $has_notary_key || $has_notary_content; then
              echo "::warning::Apple notarization secrets are only partially configured; skipping notarization for this build"
            fi
          fi
          for value in \
            "$GH_UPDATE_TOKEN_RAW" \
            "$TAURI_SIGNING_PRIVATE_KEY_RAW" \
            "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" \
            "$APPLE_CERTIFICATE_RAW" \
            "$APPLE_CERTIFICATE_PASSWORD_RAW" \
            "$APPLE_SIGNING_IDENTITY_RAW" \
            "$APPLE_API_ISSUER_RAW" \
            "$APPLE_API_KEY_RAW" \
            "$APPLE_API_KEY_CONTENT_RAW"; do
            mask_secret_if_present "$value"
          done
          {
            append_env_var_if_present VITE_GITHUB_UPDATE_TOKEN "$GH_UPDATE_TOKEN_RAW"
            append_env_var TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY_RAW"
            append_env_var_if_present TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"
            append_env_var APPLE_CERTIFICATE "$APPLE_CERTIFICATE_RAW"
            append_env_var APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_RAW"
            append_env_var APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY_RAW"
            if $apple_notarization_enabled; then
              append_env_var APPLE_API_ISSUER "$APPLE_API_ISSUER_RAW"
              append_env_var APPLE_API_KEY "$APPLE_API_KEY_RAW"
              append_env_var APPLE_API_KEY_CONTENT "$APPLE_API_KEY_CONTENT_RAW"
            fi
          } >> "$GITHUB_ENV"

      - name: Write Apple API key for notarization
        run: |
          has_value() {
            printf '%s' "$1" | grep -q '[^[:space:]]'
          }
          if has_value "$APPLE_API_ISSUER" && has_value "$APPLE_API_KEY" && has_value "$APPLE_API_KEY_CONTENT"; then
            echo "$APPLE_API_KEY_CONTENT" > "${{ runner.temp }}/AuthKey.p8"
            echo "✅ Apple notarization API key written"
          else
            rm -f "${{ runner.temp }}/AuthKey.p8"
            echo "⚠️  APPLE_API_KEY_CONTENT secret not set — notarization will be skipped"
            echo "   The .app will trigger Gatekeeper 'damaged' warnings on download"
          fi

      - name: Align Tauri plugin versions (NPM ↔ Rust)
        run: |
          echo "Checking for Tauri plugin version mismatches..."
          # Extract Rust crate versions from Cargo.lock and align NPM packages
          for plugin in dialog updater process; do
            RUST_VER=$(grep -A1 "name = \"tauri-plugin-${plugin}\"" Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)"/\1/')
            NPM_PKG="@tauri-apps/plugin-${plugin}"
            NPM_VER=$(node -e "try{console.log(require('./node_modules/${NPM_PKG}/package.json').version)}catch{console.log('none')}")
            if [ "$NPM_VER" = "none" ]; then
              continue
            fi
            RUST_MINOR="${RUST_VER%.*}"
            NPM_MINOR="${NPM_VER%.*}"
            if [ "$RUST_MINOR" != "$NPM_MINOR" ]; then
              echo "⚠️  Mismatch: tauri-plugin-${plugin} (Rust ${RUST_VER}) vs ${NPM_PKG} (NPM ${NPM_VER})"
              echo "   Updating NPM package to ^${RUST_VER}..."
              npm install "${NPM_PKG}@^${RUST_VER}" --save
            else
              echo "✅ ${plugin}: Rust ${RUST_VER} ↔ NPM ${NPM_VER}"
            fi
          done
          # Also align core @tauri-apps/api with tauri crate
          TAURI_RUST=$(grep -A1 'name = "tauri"' Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAURI_NPM=$(node -e "console.log(require('./node_modules/@tauri-apps/api/package.json').version)")
          TAURI_RUST_MINOR="${TAURI_RUST%.*}"
          TAURI_NPM_MINOR="${TAURI_NPM%.*}"
          if [ "$TAURI_RUST_MINOR" != "$TAURI_NPM_MINOR" ]; then
            echo "⚠️  Mismatch: tauri (Rust ${TAURI_RUST}) vs @tauri-apps/api (NPM ${TAURI_NPM})"
            echo "   Updating @tauri-apps/api to ^${TAURI_RUST}..."
            npm install "@tauri-apps/api@^${TAURI_RUST}" --save
          else
            echo "✅ tauri core: Rust ${TAURI_RUST} ↔ NPM ${TAURI_NPM}"
          fi

      - name: Validate Tauri signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is not set (optional)"
          fi
          echo "✅ Tauri signing secrets are configured"

      - name: Build Tauri app (macOS)
        run: |
          has_value() {
            printf '%s' "$1" | grep -q '[^[:space:]]'
          }
          if has_value "$APPLE_API_ISSUER" && has_value "$APPLE_API_KEY" && has_value "$APPLE_API_KEY_CONTENT"; then
            export APPLE_API_KEY_PATH="${{ runner.temp }}/AuthKey.p8"
          else
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_API_KEY_PATH
          fi
          npm run tauri -- build --target aarch64-apple-darwin
        env:
          LIBCLANG_PATH: /Library/Developer/CommandLineTools/usr/lib

      - name: List build artifacts
        run: |
          echo "=== DMG ==="
          find target/release/bundle/dmg -type f 2>/dev/null || echo "No DMG found"
          echo "=== App ==="
          find target/release/bundle/macos -type f -name "*.app" 2>/dev/null || echo "No .app found"
          echo "=== Updater artifacts ==="
          find target/release/bundle -name "*.tar.gz" -o -name "*.sig" 2>/dev/null || echo "No updater artifacts"
          ls -lhR target/release/bundle/ 2>/dev/null | head -50

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
            target/release/bundle/macos/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Linux Build (x64 AppImage + deb) ────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout core-shared (local dependency)
        env:
          GH_TOKEN: ${{ secrets.CORE_SHARED_TOKEN }}
        run: gh repo clone tmreyno/core-shared ../core-shared -- --depth 1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libarchive-dev pkg-config cmake \
            libssl-dev libayatana-appindicator3-dev

      - name: Set up libewf (Linux — prebuilt required)
        run: |
          PREBUILT="libewf-ffi/prebuilt/linux-x64/libewf.a"
          if [ -f "$PREBUILT" ]; then
            PREBUILT_DIR="$(cd libewf-ffi/prebuilt/linux-x64 && pwd)"
            echo "LIBEWF_DIR=$PREBUILT_DIR" >> "$GITHUB_ENV"
            echo "✅ Using pre-built libewf.a ($(ls -lh "$PREBUILT" | awk '{print $5}'))"
          else
            echo "::error::Pre-built libewf.a not found at $PREBUILT"
            echo "Run the 'Pre-build Native Dependencies' workflow (platform: linux) to build it"
            exit 1
          fi

      - name: Verify sevenzip-ffi library
        run: |
          if [ -f sevenzip-ffi/prebuilt/linux-x64/lib7z_ffi.a ]; then
            echo "✅ Pre-built lib7z_ffi.a found ($(ls -lh sevenzip-ffi/prebuilt/linux-x64/lib7z_ffi.a | awk '{print $5}'))"
          else
            echo "::error::Pre-built lib7z_ffi.a not found at sevenzip-ffi/prebuilt/linux-x64/lib7z_ffi.a"
            echo "Run the 'Pre-build Native Dependencies' workflow (platform: linux) to build it"
            exit 1
          fi

      - name: Install core-shared dependencies
        run: cd ../core-shared && npm install

      - name: Install npm dependencies
        run: npm ci

      - name: Validate and export Linux release secrets
        shell: bash
        env:
          GH_UPDATE_TOKEN_RAW: ${{ secrets.GH_UPDATE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          normalize_secret() {
            local name="$1"
            local value="${!name-}"
            if printf '%s' "$value" | grep -q '[^[:space:]]'; then
              printf -v "$name" '%s' "$value"
            else
              printf -v "$name" ''
            fi
          }
          append_env_var() {
            local key="$1"
            local value="$2"
            echo "${key}<<__ENV_EOF__"
            printf '%s\n' "$value"
            echo "__ENV_EOF__"
          }
          append_env_var_if_present() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              append_env_var "$key" "$value"
            fi
          }
          mask_secret_if_present() {
            local value="$1"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          }
          for name in GH_UPDATE_TOKEN_RAW TAURI_SIGNING_PRIVATE_KEY_RAW TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW; do
            normalize_secret "$name"
          done
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_RAW" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$GH_UPDATE_TOKEN_RAW" ]; then
            echo "::warning::GH_UPDATE_TOKEN is blank or not set; continuing without authenticated updater asset access"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is blank or not set (optional)"
          fi
          for value in "$GH_UPDATE_TOKEN_RAW" "$TAURI_SIGNING_PRIVATE_KEY_RAW" "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"; do
            mask_secret_if_present "$value"
          done
          {
            append_env_var_if_present VITE_GITHUB_UPDATE_TOKEN "$GH_UPDATE_TOKEN_RAW"
            append_env_var TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY_RAW"
            append_env_var_if_present TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"
          } >> "$GITHUB_ENV"

      - name: Align Tauri plugin versions (NPM ↔ Rust)
        run: |
          echo "Checking for Tauri plugin version mismatches..."
          for plugin in dialog updater process; do
            RUST_VER=$(grep -A1 "name = \"tauri-plugin-${plugin}\"" Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)"/\1/')
            NPM_PKG="@tauri-apps/plugin-${plugin}"
            NPM_VER=$(node -e "try{console.log(require('./node_modules/${NPM_PKG}/package.json').version)}catch{console.log('none')}")
            if [ "$NPM_VER" = "none" ]; then
              continue
            fi
            RUST_MINOR="${RUST_VER%.*}"
            NPM_MINOR="${NPM_VER%.*}"
            if [ "$RUST_MINOR" != "$NPM_MINOR" ]; then
              echo "⚠️  Mismatch: tauri-plugin-${plugin} (Rust ${RUST_VER}) vs ${NPM_PKG} (NPM ${NPM_VER})"
              echo "   Updating NPM package to ^${RUST_VER}..."
              npm install "${NPM_PKG}@^${RUST_VER}" --save
            else
              echo "✅ ${plugin}: Rust ${RUST_VER} ↔ NPM ${NPM_VER}"
            fi
          done
          TAURI_RUST=$(grep -A1 'name = "tauri"' Cargo.lock | grep version | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAURI_NPM=$(node -e "console.log(require('./node_modules/@tauri-apps/api/package.json').version)")
          TAURI_RUST_MINOR="${TAURI_RUST%.*}"
          TAURI_NPM_MINOR="${TAURI_NPM%.*}"
          if [ "$TAURI_RUST_MINOR" != "$TAURI_NPM_MINOR" ]; then
            echo "⚠️  Mismatch: tauri (Rust ${TAURI_RUST}) vs @tauri-apps/api (NPM ${TAURI_NPM})"
            echo "   Updating @tauri-apps/api to ^${TAURI_RUST}..."
            npm install "@tauri-apps/api@^${TAURI_RUST}" --save
          else
            echo "✅ tauri core: Rust ${TAURI_RUST} ↔ NPM ${TAURI_NPM}"
          fi

      - name: Validate Tauri signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is not set (optional)"
          fi
          echo "✅ Tauri signing secrets are configured"

      - name: Build Tauri app (Linux)
        run: npm run tauri build

      - name: List build artifacts
        run: |
          echo "=== AppImage ==="
          find target/release/bundle/appimage -type f 2>/dev/null || echo "No AppImage found"
          echo "=== DEB ==="
          find target/release/bundle/deb -type f 2>/dev/null || echo "No deb found"
          echo "=== Updater artifacts ==="
          find target/release/bundle -name "*.tar.gz" -o -name "*.sig" 2>/dev/null || echo "No updater artifacts"
          ls -lhR target/release/bundle/ 2>/dev/null | head -50

      - name: Upload Linux installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.tar.gz
            target/release/bundle/appimage/*.sig
            target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Windows Build (x64 MSI + EXE) ─────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout core-shared (local dependency)
        env:
          GH_TOKEN: ${{ secrets.CORE_SHARED_TOKEN }}
        run: gh repo clone tmreyno/core-shared ../core-shared -- --depth 1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install LLVM (for bindgen/libclang)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'
          directory: 'C:\LLVM'

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vcpkg-win-x64-static-compress-libs-v2
          restore-keys: vcpkg-win-x64-static-compress-

      - name: Check for pre-built native libraries
        id: prebuilt
        run: |
          $archivePrebuilt = "patches\libarchive2-sys\prebuilt\windows-x64-msvc\archive.lib"
          $sevenzipPrebuilt = "sevenzip-ffi\prebuilt\windows-x64-msvc\7z_ffi.lib"
          $libewfPrebuilt = "libewf-ffi\prebuilt\windows-x64-msvc\ewf.lib"
          $allGood = $true

          if (Test-Path $archivePrebuilt) {
            Write-Host "✅ Pre-built archive.lib found"
            $libs = Get-ChildItem "patches\libarchive2-sys\prebuilt\windows-x64-msvc\*.lib"
            foreach ($lib in $libs) {
              Write-Host "  $($lib.Name) ($('{0:N0}' -f ($lib.Length / 1KB)) KB)"
            }
            echo "has_archive=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "⚠️  No pre-built archive.lib — will build from source via CMake"
            echo "has_archive=false" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path $sevenzipPrebuilt) {
            Write-Host "✅ Pre-built 7z_ffi.lib found"
            echo "has_sevenzip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::error::Pre-built 7z_ffi.lib not found at $sevenzipPrebuilt"
            Write-Host "Run the 'Pre-build Native Dependencies' workflow (platform: windows) to build it"
            $allGood = $false
            echo "has_sevenzip=false" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path $libewfPrebuilt) {
            Write-Host "✅ Pre-built ewf.lib found ($('{0:N0}' -f ((Get-Item $libewfPrebuilt).Length / 1KB)) KB)"
            echo "has_libewf=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::error::Pre-built ewf.lib not found at $libewfPrebuilt"
            Write-Host "Run the 'Pre-build Native Dependencies' workflow (platform: windows) to build it"
            $allGood = $false
            echo "has_libewf=false" >> $env:GITHUB_OUTPUT
          }

          if (-not $allGood) { exit 1 }
        shell: pwsh

      - name: Install vcpkg dependencies (fallback — only if no pre-built libs)
        if: steps.prebuilt.outputs.has_archive != 'true'
        run: |
          # Bootstrap vcpkg
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

          # Install compression libraries needed by libarchive (built from source)
          # and libewf. We do NOT install vcpkg's pre-built libarchive package
          # because it includes OpenSSL as a dependency, and its archive.lib
          # (compiled with OpenSSL) conflicts with our CMake-built archive.lib
          # (compiled without OpenSSL), causing LNK2019 unresolved externals
          # for EVP_* symbols.
          C:\vcpkg\vcpkg.exe install zlib:x64-windows-static bzip2:x64-windows-static liblzma:x64-windows-static zstd:x64-windows-static lz4:x64-windows-static

          # Set environment for build scripts
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_DYNAMIC=0" >> $env:GITHUB_ENV

          # vcpkg paths for compression library linking
          $vcpkgRoot = "C:\vcpkg\installed\x64-windows-static"
          echo "LIBARCHIVE_LIB_DIR=$vcpkgRoot\lib" >> $env:GITHUB_ENV
          echo "LIBARCHIVE_INCLUDE_DIR=$vcpkgRoot\include" >> $env:GITHUB_ENV

          # pkg-config for any crate that needs it
          echo "PKG_CONFIG_PATH=$vcpkgRoot\lib\pkgconfig" >> $env:GITHUB_ENV

          # LLVM/Clang for bindgen (libarchive2-sys FFI generation)
          echo "LIBCLANG_PATH=C:\LLVM\bin" >> $env:GITHUB_ENV

          # Verify no conflicting archive.lib exists in vcpkg
          if (Test-Path "$vcpkgRoot\lib\archive.lib") {
            Write-Host "⚠️  Removing conflicting vcpkg archive.lib"
            Remove-Item "$vcpkgRoot\lib\archive.lib" -Force
          }
          if (Test-Path "$vcpkgRoot\lib\archive_static.lib") {
            Remove-Item "$vcpkgRoot\lib\archive_static.lib" -Force
          }

          Write-Host "✅ vcpkg compression libraries installed"
          Get-ChildItem "$vcpkgRoot\lib\*.lib" | ForEach-Object { Write-Host "  $($_.Name)" }

        shell: pwsh

      - name: Set LIBCLANG_PATH (for bindgen)
        if: steps.prebuilt.outputs.has_archive == 'true'
        run: |
          echo "LIBCLANG_PATH=C:\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up pre-built libewf (Windows)
        if: steps.prebuilt.outputs.has_libewf == 'true'
        run: |
          $prebuiltDir = "$env:GITHUB_WORKSPACE\libewf-ffi\prebuilt\windows-x64-msvc"
          echo "LIBEWF_DIR=$prebuiltDir" >> $env:GITHUB_ENV
          Write-Host "✅ LIBEWF_DIR set to $prebuiltDir"
          Get-ChildItem "$prebuiltDir\*.lib" | ForEach-Object {
            Write-Host "  $($_.Name) ($('{0:N0}' -f ($_.Length / 1KB)) KB)"
          }
        shell: pwsh

      - name: Verify sevenzip-ffi library (Windows)
        run: |
          if (Test-Path "sevenzip-ffi\prebuilt\windows-x64-msvc\7z_ffi.lib") {
            Write-Host "✅ Pre-built 7z_ffi.lib found"
          } else {
            Write-Host "::error::Pre-built 7z_ffi.lib not found"
            Write-Host "Run the 'Pre-build Native Dependencies' workflow (platform: windows) to build it"
            exit 1
          }
        shell: pwsh

      - name: Install core-shared dependencies
        run: cd ../core-shared; npm install

      - name: Install npm dependencies
        run: npm ci

      - name: Validate and export Windows release secrets
        shell: bash
        env:
          GH_UPDATE_TOKEN_RAW: ${{ secrets.GH_UPDATE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          normalize_secret() {
            local name="$1"
            local value="${!name-}"
            if printf '%s' "$value" | grep -q '[^[:space:]]'; then
              printf -v "$name" '%s' "$value"
            else
              printf -v "$name" ''
            fi
          }
          append_env_var() {
            local key="$1"
            local value="$2"
            echo "${key}<<__ENV_EOF__"
            printf '%s\n' "$value"
            echo "__ENV_EOF__"
          }
          append_env_var_if_present() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              append_env_var "$key" "$value"
            fi
          }
          mask_secret_if_present() {
            local value="$1"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          }
          for name in GH_UPDATE_TOKEN_RAW TAURI_SIGNING_PRIVATE_KEY_RAW TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW; do
            normalize_secret "$name"
          done
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_RAW" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$GH_UPDATE_TOKEN_RAW" ]; then
            echo "::warning::GH_UPDATE_TOKEN is blank or not set; continuing without authenticated updater asset access"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is blank or not set (optional)"
          fi
          for value in "$GH_UPDATE_TOKEN_RAW" "$TAURI_SIGNING_PRIVATE_KEY_RAW" "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"; do
            mask_secret_if_present "$value"
          done
          {
            append_env_var_if_present VITE_GITHUB_UPDATE_TOKEN "$GH_UPDATE_TOKEN_RAW"
            append_env_var TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY_RAW"
            append_env_var_if_present TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_RAW"
          } >> "$GITHUB_ENV"

      - name: Align Tauri plugin versions (NPM ↔ Rust)
        run: |
          Write-Host "Checking for Tauri plugin version mismatches..."
          $plugins = @("dialog", "updater", "process")
          $lockContent = Get-Content "Cargo.lock" -Raw
          foreach ($plugin in $plugins) {
            if ($lockContent -match "name = `"tauri-plugin-$plugin`"\s*\nversion = `"([^`"]+)`"") {
              $rustVer = $matches[1]
            } else { continue }
            $npmPkg = "@tauri-apps/plugin-$plugin"
            try {
              $npmVer = node -e "console.log(require('./node_modules/$npmPkg/package.json').version)"
            } catch { continue }
            $rustMinor = $rustVer -replace '\.\d+$', ''
            $npmMinor = $npmVer -replace '\.\d+$', ''
            if ($rustMinor -ne $npmMinor) {
              Write-Host "⚠️  Mismatch: tauri-plugin-$plugin (Rust $rustVer) vs $npmPkg (NPM $npmVer)"
              npm install "${npmPkg}@^${rustVer}" --save
            } else {
              Write-Host "✅ ${plugin}: Rust $rustVer ↔ NPM $npmVer"
            }
          }
          # Core tauri
          if ($lockContent -match 'name = "tauri"\s*\nversion = "([^"]+)"') {
            $tauriRust = $matches[1]
            $tauriNpm = node -e "console.log(require('./node_modules/@tauri-apps/api/package.json').version)"
            $trMinor = $tauriRust -replace '\.\d+$', ''
            $tnMinor = $tauriNpm -replace '\.\d+$', ''
            if ($trMinor -ne $tnMinor) {
              Write-Host "⚠️  Mismatch: tauri (Rust $tauriRust) vs @tauri-apps/api (NPM $tauriNpm)"
              npm install "@tauri-apps/api@^${tauriRust}" --save
            } else {
              Write-Host "✅ tauri core: Rust $tauriRust ↔ NPM $tauriNpm"
            }
          }
        shell: pwsh

      - name: Set BINDGEN include paths (only when vcpkg was installed)
        if: steps.prebuilt.outputs.has_archive != 'true'
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS=-IC:\vcpkg\installed\x64-windows-static\include" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Validate Tauri signing key
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is not set (optional)"
          }
          Write-Host "✅ Tauri signing secrets are configured"
        shell: pwsh

      - name: Build Tauri app (Windows)
        run: npm run tauri build

      - name: List build artifacts
        run: |
          echo "=== MSI ==="
          Get-ChildItem -Recurse target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue
          echo "=== NSIS ==="
          Get-ChildItem -Recurse target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
          echo "=== Updater artifacts ==="
          Get-ChildItem -Recurse target\release\bundle\nsis\*.zip -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse target\release\bundle\nsis\*.sig -ErrorAction SilentlyContinue
          echo "=== Binary ==="
          Get-ChildItem target\release\*.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*core*" -or $_.Name -like "*CORE*" }
        shell: pwsh

      - name: Upload Windows installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.zip
            target/release/bundle/nsis/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Publish Release & Generate Update Manifest ──────────────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          TAG="${{ needs.create-release.outputs.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code for changelog and README
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}
          sparse-checkout: |
            CHANGELOG.md
            README.md
          sparse-checkout-cone-mode: false

      - name: Download release artifacts for manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          # Download updater artifacts from the draft release.
          # Tauri v2 (createUpdaterArtifacts: true) produces:
          #   macOS:   *.app.tar.gz + *.app.tar.gz.sig
          #   Windows: *-setup.exe + *-setup.exe.sig (raw NSIS installer)
          #   Linux:   *.AppImage + *.AppImage.sig (raw AppImage)
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "$GH_REPO" \
            --pattern "*.sig" \
            --pattern "*.tar.gz" \
            --pattern "*.dmg" \
            --pattern "*-setup.exe" \
            --pattern "*.AppImage" \
            --dir artifacts || true
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Generate latest.json update manifest
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Extract release notes from CHANGELOG.md
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${VERSION}\]?/,/^## \[?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG} of CORE-FFX"
          fi

          export TAG VERSION REPO BASE_URL PUB_DATE NOTES
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          artifacts = pathlib.Path("artifacts")
          prefix = "CORE-FFX"
          base_url = os.environ["BASE_URL"]

          def first(pattern):
              matches = sorted(artifacts.glob(pattern))
              return matches[0] if matches else None

          def read_signature(path):
              return path.read_text(encoding="utf-8").strip()

          def release_url(path):
              return f"{base_url}/{path.name}"

          def macos_platforms():
              platforms = []
              for dmg in sorted(artifacts.glob(f"{prefix}*.dmg")):
                  name = dmg.name.lower()
                  if "universal" in name:
                      return ["darwin-aarch64", "darwin-x86_64"]
                  if "aarch64" in name or "arm64" in name:
                      platforms.append("darwin-aarch64")
                  if re.search(r"(^|[_-])(x64|x86_64|amd64)([_\\-.]|$)", name):
                      platforms.append("darwin-x86_64")
              return list(dict.fromkeys(platforms))

          platforms = {}

          mac_sig = first(f"{prefix}*.app.tar.gz.sig")
          mac_bundle = first(f"{prefix}*.app.tar.gz")
          if mac_sig and mac_bundle:
              archs = macos_platforms()
              if not archs:
                  print(
                      "macOS updater artifact exists, but no DMG architecture marker "
                      "(aarch64, arm64, x64, x86_64, amd64, or universal) was found.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              for platform in archs:
                  platforms[platform] = {
                      "signature": read_signature(mac_sig),
                      "url": release_url(mac_bundle),
                  }

          win_sig = first(f"{prefix}*-setup.exe.sig")
          win_bundle = first(f"{prefix}*-setup.exe")
          if win_sig and win_bundle:
              platforms["windows-x86_64"] = {
                  "signature": read_signature(win_sig),
                  "url": release_url(win_bundle),
              }

          linux_sig = first(f"{prefix}*.AppImage.sig")
          linux_bundle = first(f"{prefix}*.AppImage")
          if linux_sig and linux_bundle:
              platforms["linux-x86_64"] = {
                  "signature": read_signature(linux_sig),
                  "url": release_url(linux_bundle),
              }

          if not platforms:
              print("No updater platforms were discovered from release artifacts.", file=sys.stderr)
              sys.exit(1)

          manifest = {
              "version": os.environ["VERSION"],
              "notes": os.environ["NOTES"].strip() or f"Release {os.environ['TAG']} of CORE-FFX",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": platforms,
          }

          pathlib.Path("latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          print("=== Generated latest.json ===")
          print(pathlib.Path("latest.json").read_text(encoding="utf-8"))
          PY

      - name: Upload update manifests
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (un-draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version references on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating version references to ${VERSION}"

          # ── Fresh checkout of main (not the tag) ──
          # Disable sparse-checkout so we get full tree for clean branch switch
          git sparse-checkout disable 2>/dev/null || true
          git fetch origin main
          git checkout -B release-docs-update origin/main

          # ── 1. README badge ──
          sed -i "s/version-[0-9]*\.[0-9]*\.[0-9]*-blue/version-${VERSION}-blue/g" README.md
          echo "✓ README badge → ${VERSION}"

          # ── 2. CHANGELOG comparison links ──
          if [ -f CHANGELOG.md ]; then
            git tag -d "$TAG" >/dev/null 2>&1 || true
            git fetch origin --tags
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | awk -v tag="$TAG" '$0 != tag { print; exit }')
            export TAG VERSION PREV_TAG

            python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("CHANGELOG.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          prev_tag = os.environ.get("PREV_TAG", "").strip()

          if not any(line.strip() == "## [Unreleased]" for line in lines):
            insert_at = next((i for i, line in enumerate(lines) if re.match(r"^## \[\d+\.\d+\.\d+\]", line)), len(lines))
            lines[insert_at:insert_at] = ["## [Unreleased]", ""]

          unreleased_ref = f"[Unreleased]: https://github.com/{repo}/compare/{tag}...HEAD"
          unreleased_idx = next((i for i, line in enumerate(lines) if line.startswith("[Unreleased]: ")), None)
          if unreleased_idx is None:
            if lines and lines[-1] != "":
              lines.append("")
            lines.append(unreleased_ref)
            unreleased_idx = len(lines) - 1
          else:
            lines[unreleased_idx] = unreleased_ref

          version_ref = (
            f"[{version}]: https://github.com/{repo}/compare/{prev_tag}...{tag}"
            if prev_tag
            else f"[{version}]: https://github.com/{repo}/releases/tag/{tag}"
          )
          version_prefix = f"[{version}]: "
          version_idx = next((i for i, line in enumerate(lines) if line.startswith(version_prefix)), None)
          if version_idx is None:
            lines.insert(unreleased_idx + 1, version_ref)
          else:
            lines[version_idx] = version_ref

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

            echo "✓ CHANGELOG comparison links synced for ${VERSION}"
          fi

          # ── Commit and push if anything changed ──
          if git diff --quiet; then
            echo "All version references already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md CHANGELOG.md
            git commit -m "docs: update version references to ${VERSION} [skip ci]"
            git -c push.followTags=false push origin "refs/heads/release-docs-update:refs/heads/main"
            echo "✓ Pushed version reference updates to main"
          fi
